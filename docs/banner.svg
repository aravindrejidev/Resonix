<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Resonix: bit-perfect music player for Android" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282C34"/>
      <stop offset="1" stop-color="#1A1D23"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A91"/>
      <stop offset="0.5" stop-color="#FF5A64"/>
      <stop offset="1" stop-color="#E5333F"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A91"/>
      <stop offset="0.55" stop-color="#FF5A64"/>
      <stop offset="1" stop-color="#E5333F"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#2B2F38"/>
      <stop offset="1" stop-color="#1E2127"/>
    </radialGradient>
    <radialGradient id="glowbg" cx="0.15" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#FF5A64" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FF5A64" stop-opacity="0"/>
    </radialGradient>
    <filter id="raised" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="10" dy="10" result="dark"/>
      <feFlood flood-color="#0E1013" flood-opacity="0.85"/>
      <feComposite in2="dark" operator="in" result="darkShadow"/>
      <feOffset in="blur" dx="-8" dy="-8" result="light"/>
      <feFlood flood-color="#3A3F4C" flood-opacity="0.75"/>
      <feComposite in2="light" operator="in" result="lightShadow"/>
      <feMerge>
        <feMergeNode in="darkShadow"/>
        <feMergeNode in="lightShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="30" fill="url(#glowbg)"/>
  <rect x="1" y="1" width="1278" height="418" rx="29" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- raised plate with app icon -->
  <circle cx="190" cy="210" r="112" fill="url(#plate)" filter="url(#raised)"/>
  <circle cx="190" cy="210" r="86" fill="none" stroke="url(#ring)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="190" cy="210" r="52" fill="#FFFFFF"/>
  <polygon points="172.7,177.3 172.7,242.7 230.4,210.0" fill="#1B1B2F" stroke="#1B1B2F" stroke-width="5" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="340" y="132" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4.5" fill="#FF5A64">BIT-PERFECT MUSIC PLAYER FOR ANDROID</text>
  <text x="336" y="214" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="5" fill="#ECEFF5">RESONIX</text>
  <text x="340" y="262" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="500" fill="#9AA2B5">Hear it exactly as it was recorded.</text>

  <g>
    <rect x="340" y="296" width="155" height="38" rx="19" fill="#1D2026" stroke="#30343F"/><circle cx="358" cy="315" r="3.5" fill="#FF5A64"/><text x="423.5" y="320" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#9AA2B5">FFmpeg decoding</text>
    <rect x="507" y="296" width="117" height="38" rx="19" fill="#1D2026" stroke="#30343F"/><circle cx="525" cy="315" r="3.5" fill="#FF5A64"/><text x="571.5" y="320" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#9AA2B5">64-bit DSP</text>
    <rect x="636" y="296" width="163" height="38" rx="19" fill="#1D2026" stroke="#30343F"/><circle cx="654" cy="315" r="3.5" fill="#FF5A64"/><text x="723.5" y="320" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#9AA2B5">AAudio exclusive</text>
    <rect x="811" y="296" width="186" height="38" rx="19" fill="#1D2026" stroke="#30343F"/><circle cx="829" cy="315" r="3.5" fill="#FF5A64"/><text x="910.0" y="320" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#9AA2B5">USB DAC bit-perfect</text>
  </g>

  <!-- waveform -->
  <g>
    <rect x="1010" y="198.0" width="6" height="24.0" rx="3" fill="url(#bar)" fill-opacity="0.35"/>
    <rect x="1020" y="184.6" width="6" height="50.9" rx="3" fill="url(#bar)" fill-opacity="0.48"/>
    <rect x="1030" y="181.3" width="6" height="57.4" rx="3" fill="url(#bar)" fill-opacity="0.58"/>
    <rect x="1040" y="164.4" width="6" height="91.1" rx="3" fill="url(#bar)" fill-opacity="0.66"/>
    <rect x="1050" y="159.4" width="6" height="101.2" rx="3" fill="url(#bar)" fill-opacity="0.73"/>
    <rect x="1060" y="146.3" width="6" height="127.5" rx="3" fill="url(#bar)" fill-opacity="0.80"/>
    <rect x="1070" y="151.0" width="6" height="117.9" rx="3" fill="url(#bar)" fill-opacity="0.86"/>
    <rect x="1080" y="156.3" width="6" height="107.5" rx="3" fill="url(#bar)" fill-opacity="0.90"/>
    <rect x="1090" y="135.6" width="6" height="148.8" rx="3" fill="url(#bar)" fill-opacity="0.94"/>
    <rect x="1100" y="139.3" width="6" height="141.4" rx="3" fill="url(#bar)" fill-opacity="0.97"/>
    <rect x="1110" y="119.0" width="6" height="182.1" rx="3" fill="url(#bar)" fill-opacity="0.99"/>
    <rect x="1120" y="148.5" width="6" height="123.0" rx="3" fill="url(#bar)" fill-opacity="1.00"/>
    <rect x="1130" y="147.3" width="6" height="125.4" rx="3" fill="url(#bar)" fill-opacity="1.00"/>
    <rect x="1140" y="149.3" width="6" height="121.4" rx="3" fill="url(#bar)" fill-opacity="0.99"/>
    <rect x="1150" y="118.7" width="6" height="182.6" rx="3" fill="url(#bar)" fill-opacity="0.97"/>
    <rect x="1160" y="144.1" width="6" height="131.8" rx="3" fill="url(#bar)" fill-opacity="0.94"/>
    <rect x="1170" y="144.1" width="6" height="131.7" rx="3" fill="url(#bar)" fill-opacity="0.90"/>
    <rect x="1180" y="159.6" width="6" height="100.7" rx="3" fill="url(#bar)" fill-opacity="0.86"/>
    <rect x="1190" y="152.6" width="6" height="114.8" rx="3" fill="url(#bar)" fill-opacity="0.80"/>
    <rect x="1200" y="153.1" width="6" height="113.7" rx="3" fill="url(#bar)" fill-opacity="0.73"/>
    <rect x="1210" y="166.8" width="6" height="86.4" rx="3" fill="url(#bar)" fill-opacity="0.66"/>
    <rect x="1220" y="175.7" width="6" height="68.6" rx="3" fill="url(#bar)" fill-opacity="0.58"/>
    <rect x="1230" y="188.2" width="6" height="43.5" rx="3" fill="url(#bar)" fill-opacity="0.48"/>
    <rect x="1240" y="198.0" width="6" height="24.0" rx="3" fill="url(#bar)" fill-opacity="0.35"/>
  </g>
</svg>
