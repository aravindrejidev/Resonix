name: Signed Release

# Builds a signed release APK and attaches it to a GitHub release.
#   * Push a tag such as v0.2.0 to build and publish it, or
#   * run the workflow by hand to just get the signed APK as a build artifact.
#
# One-time setup (Settings -> Secrets and variables -> Actions):
#   RESONIX_KEYSTORE_BASE64    the keystore file, base64-encoded:  base64 -w0 resonix-release.jks
#   RESONIX_KEYSTORE_PASSWORD  keystore password
#   RESONIX_KEY_ALIAS          key alias
#   RESONIX_KEY_PASSWORD       key password
# Create a keystore once with:
#   keytool -genkeypair -v -keystore resonix-release.jks -alias resonix -keyalg RSA -keysize 4096 -validity 10000
# and keep it (and its passwords) safe: updates must be signed with the same key.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # to attach the APK to the release

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Add Android cmdline-tools to PATH
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK 28 and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RESONIX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RESONIX_KEYSTORE_BASE64 is not set; see the notes at the top of this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/resonix-release.jks"
          echo "RESONIX_KEYSTORE_PATH=$RUNNER_TEMP/resonix-release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          RESONIX_KEYSTORE_PASSWORD: ${{ secrets.RESONIX_KEYSTORE_PASSWORD }}
          RESONIX_KEY_ALIAS: ${{ secrets.RESONIX_KEY_ALIAS }}
          RESONIX_KEY_PASSWORD: ${{ secrets.RESONIX_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: resonix-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
