name: Build FFmpeg (one-time, manual)

# This does NOT run as part of the normal app build.
# Run it once via the Actions tab, download the
# "resonix-ffmpeg-libs" artifact it produces, and commit
# its contents into app/src/main/cpp/ffmpeg/.
#
# Re-run only if you bump FFMPEG_VERSION.

on:
  workflow_dispatch:

env:
  FFMPEG_VERSION: n9.0.1
  NDK_VERSION: "28.2.13676358"
  MIN_SDK: 26

jobs:
  build-ffmpeg:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            arch: aarch64
            cpu: armv8-a
            triple: aarch64-linux-android

          - abi: armeabi-v7a
            arch: arm
            cpu: armv7-a
            triple: armv7a-linux-androideabi

          - abi: x86_64
            arch: x86_64
            cpu: x86-64
            triple: x86_64-linux-android

    steps:

      # ---------------------------------------------------------
      # Build tools
      # ---------------------------------------------------------
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm

      # ---------------------------------------------------------
      # Android command-line tools
      # ---------------------------------------------------------
      - name: Add Android cmdline-tools to PATH
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # Android SDK licenses
      # ---------------------------------------------------------
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # ---------------------------------------------------------
      # NDK
      # ---------------------------------------------------------
      - name: Verify / install NDK ${{ env.NDK_VERSION }}
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"

          # Check whether the required NDK is already installed.
          if [ -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "NDK already available:"
            echo "$NDK_ROOT"
          else
            echo "NDK not found."
            echo "Installing NDK ${{ env.NDK_VERSION }}..."

            for attempt in 1 2 3; do

              if yes | sdkmanager \
                --sdk_root="$ANDROID_SDK_ROOT" \
                --install "ndk;${{ env.NDK_VERSION }}"; then

                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "NDK installation failed after 3 attempts."
                exit 1
              fi

              echo "NDK installation attempt $attempt failed."
              echo "Retrying in 10 seconds..."

              sleep 10
            done
          fi

          # Verify the NDK installation.
          test -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          echo "NDK verified successfully:"
          echo "$NDK_ROOT"

      # ---------------------------------------------------------
      # FFmpeg source
      # ---------------------------------------------------------
      - name: Checkout FFmpeg ${{ env.FFMPEG_VERSION }}
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --branch "${{ env.FFMPEG_VERSION }}" \
            --depth 1 \
            https://git.ffmpeg.org/ffmpeg.git \
            ffmpeg-src

      # ---------------------------------------------------------
      # Configure + build
      # ---------------------------------------------------------
      - name: Configure and build for ${{ matrix.abi }}
        working-directory: ffmpeg-src
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"

          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"

          CC="$TOOLCHAIN/bin/${{ matrix.triple }}${{ env.MIN_SDK }}-clang"

          CXX="$TOOLCHAIN/bin/${{ matrix.triple }}${{ env.MIN_SDK }}-clang++"

          OUT_DIR="$GITHUB_WORKSPACE/ffmpeg-out/${{ matrix.abi }}"

          mkdir -p "$OUT_DIR"

          echo "========================================"
          echo "Building FFmpeg ${{ env.FFMPEG_VERSION }}"
          echo "ABI: ${{ matrix.abi }}"
          echo "Architecture: ${{ matrix.arch }}"
          echo "CPU: ${{ matrix.cpu }}"
          echo "NDK: ${{ env.NDK_VERSION }}"
          echo "Min SDK: ${{ env.MIN_SDK }}"
          echo "========================================"

          # Verify compiler exists.
          test -x "$CC"
          test -x "$CXX"

          echo "Compiler:"
          "$CC" --version | head -n 1

          # -----------------------------------------------------
          # Audio-focused FFmpeg build
          #
          # Important:
          # FFmpeg 9.x no longer has libpostproc.
          # Therefore DO NOT use --disable-postproc.
          # -----------------------------------------------------

          ./configure \
            --prefix="$OUT_DIR" \
            --target-os=android \
            --arch=${{ matrix.arch }} \
            --cpu=${{ matrix.cpu }} \
            --enable-cross-compile \
            --cc="$CC" \
            --cxx="$CXX" \
            --ar="$TOOLCHAIN/bin/llvm-ar" \
            --nm="$TOOLCHAIN/bin/llvm-nm" \
            --ranlib="$TOOLCHAIN/bin/llvm-ranlib" \
            --strip="$TOOLCHAIN/bin/llvm-strip" \
            --sysroot="$TOOLCHAIN/sysroot" \
            --enable-shared \
            --disable-static \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-avfilter \
            --disable-network \
            --enable-protocol=file \
            --disable-encoders \
            --disable-muxers \
            --disable-asm \
            --disable-gpl \
            --disable-symver \
            --extra-cflags="-O3 -fPIC"

          # -----------------------------------------------------
          # Build
          # -----------------------------------------------------

          make -j"$(nproc)"

          # -----------------------------------------------------
          # Install into output directory
          # -----------------------------------------------------

          make install

          echo "========================================"
          echo "FFmpeg build completed:"
          echo "$OUT_DIR"
          echo "========================================"

          find "$OUT_DIR" -maxdepth 3 -type f | sort

      # ---------------------------------------------------------
      # Upload ABI build
      # ---------------------------------------------------------
      - name: Upload ${{ matrix.abi }} build
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: ffmpeg-out/${{ matrix.abi }}
          retention-days: 14

  # =============================================================
  # Package all ABI builds
  # =============================================================

  package:
    needs: build-ffmpeg

    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # Download arm64-v8a
      # ---------------------------------------------------------
      - name: Download arm64-v8a build
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-arm64-v8a
          path: collected/arm64-v8a

      # ---------------------------------------------------------
      # Download armeabi-v7a
      # ---------------------------------------------------------
      - name: Download armeabi-v7a build
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-armeabi-v7a
          path: collected/armeabi-v7a

      # ---------------------------------------------------------
      # Download x86_64
      # ---------------------------------------------------------
      - name: Download x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-x86_64
          path: collected/x86_64

      # ---------------------------------------------------------
      # Assemble final FFmpeg package
      # ---------------------------------------------------------
      - name: Assemble app/src/main/cpp/ffmpeg layout
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p resonix-ffmpeg/include

          mkdir -p resonix-ffmpeg/lib/arm64-v8a
          mkdir -p resonix-ffmpeg/lib/armeabi-v7a
          mkdir -p resonix-ffmpeg/lib/x86_64

          # Headers
          cp -r \
            collected/arm64-v8a/include/. \
            resonix-ffmpeg/include/

          # arm64-v8a libraries
          cp \
            collected/arm64-v8a/lib/*.so* \
            resonix-ffmpeg/lib/arm64-v8a/

          # armeabi-v7a libraries
          cp \
            collected/armeabi-v7a/lib/*.so* \
            resonix-ffmpeg/lib/armeabi-v7a/

          # x86_64 libraries
          cp \
            collected/x86_64/lib/*.so* \
            resonix-ffmpeg/lib/x86_64/

          echo "========================================"
          echo "Final FFmpeg package:"
          echo "========================================"

          find resonix-ffmpeg -type f | sort

      # ---------------------------------------------------------
      # Upload combined package
      # ---------------------------------------------------------
      - name: Upload combined ffmpeg package
        uses: actions/upload-artifact@v4
        with:
          name: resonix-ffmpeg-libs
          path: resonix-ffmpeg
          retention-days: 90
